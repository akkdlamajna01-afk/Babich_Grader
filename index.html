<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brainrot Grader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #080b11;
      --panel-bg: #121824;
      --panel-border: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --gold: #facc15;
      --green: #22c55e;
      --red: #ef4444;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Мобильный контейнер Telegram Mini App */
    .app-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #0d131d 0%, #080b11 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 85px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    /* Верхняя панель */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: rgba(18, 24, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo span {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .balance-badge {
      display: flex;
      align-items: center;
      background: #1a2233;
      border: 1px solid #2a364d;
      border-radius: 12px;
      padding: 6px 12px;
      gap: 8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .balance-num {
      font-weight: 900;
      font-size: 15px;
      color: var(--gold);
    }
    .add-coin-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
      transition: transform 0.1s;
    }
    .add-coin-btn:active {
      transform: scale(0.9);
    }

    /* Основной контент */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.25s ease;
    }
    .tab-pane.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Стеклянные карточки */
    .glass-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    /* ----- ВКЛАДКА 1: АПГРЕЙД ----- */
    .wheel-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .wheel-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #1e293b;
      border-top-color: var(--green);
      border-right-color: var(--green);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
      transition: transform 0.8s cubic-bezier(0.15, 0.85, 0.15, 1);
    }
    .wheel-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }
    .wheel-chance {
      font-size: 28px;
      font-weight: 900;
      color: var(--green);
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }
    .wheel-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-preview {
      background: #182030;
      border: 1px solid #2a364d;
      border-radius: 14px;
      padding: 12px 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .item-emoji-box {
      font-size: 28px;
      background: #222b3d;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
    }
    .item-name {
      font-weight: 800;
      font-size: 14px;
    }
    .item-val {
      font-size: 12px;
      color: var(--gold);
      font-weight: 700;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
      transition: transform 0.1s, filter 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .action-btn:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }
    .action-btn.secondary {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    /* ----- ВКЛАДКА 2: НАГРАДЫ ----- */
    .reward-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #121824 100%);
      border: 1px solid #4338ca;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(67, 56, 202, 0.2);
    }
    .promo-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .promo-input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #2a364d;
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      font-weight: 800;
      font-size: 14px;
      outline: none;
      text-transform: uppercase;
    }
    .promo-input:focus {
      border-color: var(--accent);
    }

    /* Нижнее меню навигации (2 кнопки) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 420px;
      background: rgba(18, 24, 36, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 16px 18px;
      z-index: 30;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      flex: 1;
      padding: 6px;
      border-radius: 14px;
      transition: all 0.2s;
    }
    .nav-tab.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .nav-icon {
      font-size: 22px;
    }

    /* Всплывающие уведомления (Toast) */
    .toast {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1e293b;
      border: 1px solid var(--accent);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Шапка -->
  <div class="header">
    <div class="logo">⚡ BRAINROT <span>GRADER</span></div>
    <div class="balance-badge">
      <span style="font-size: 14px;">🟡</span>
      <span class="balance-num" id="balance">25</span>
      <button class="add-coin-btn" onclick="addCoins(10)">+</button>
    </div>
  </div>

  <!-- Уведомление -->
  <div id="toast" class="toast">Уведомление</div>

  <div class="content">
    
    <!-- ВКЛАДКА 1: АПГРЕЙД -->
    <div id="pane-upgrade" class="tab-pane active">
      <div class="glass-card">
        <div style="font-weight: 900; font-size: 16px; letter-spacing: 0.5px;">РУЛЕТКА АПГРЕЙДА (x2)</div>
        
        <div class="wheel-container">
          <div class="wheel-ring" id="wheel"></div>
          <div class="wheel-center">
            <div class="wheel-chance">50%</div>
            <div class="wheel-label">ШАНС УСПЕХА</div>
          </div>
        </div>

        <div class="item-preview">
          <div class="item-info">
            <div class="item-emoji-box" id="item-emoji">🗿</div>
            <div>
              <div class="item-name" id="item-name">Сигма Бабич</div>
              <div class="item-val">Ценность: <span id="item-value">10</span> 🟡</div>
            </div>
          </div>
        </div>

        <button class="action-btn" onclick="spinUpgrade()">КРУТИТЬ АПГРЕЙД (x2)</button>
      </div>
    </div>

    <!-- ВКЛАДКА 2: НАГРАДЫ -->
    <div id="pane-rewards" class="tab-pane">
      <div class="reward-banner">
        <div style="font-size: 38px;">🎁</div>
        <div style="font-weight: 900; font-size: 18px;">Ежедневная Халява</div>
        <div style="font-size: 13px; color: var(--text-muted); line-height: 1.4;">Забирай бонусные монеты для прокачки и круток прямо сейчас!</div>
        <button class="action-btn secondary" onclick="claimDaily()">ЗАБРАТЬ +50 🟡</button>
      </div>

      <div class="glass-card" style="align-items: stretch; text-align: left;">
        <div style="font-weight: 900; font-size: 15px;">Активация промокода</div>
        <div class="promo-row">
          <input type="text" id="promo-input" class="promo-input" placeholder="ВВЕДИ КОД..." />
          <button class="action-btn" style="width: auto; padding: 0 20px;" onclick="applyPromo()">ОК</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Нижнее меню навигации (ровно 2 планки) -->
  <div class="bottom-nav">
    <div class="nav-tab active" onclick="switchTab('upgrade', this)">
      <div class="nav-icon">🎡</div>
      <div>Апгрейд</div>
    </div>
    <div class="nav-tab" onclick="switchTab('rewards', this)">
      <div class="nav-icon">🎁</div>
      <div>Награды</div>
    </div>
  </div>
</div>

<script>
  // Telegram WebApp инициализация
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#121824');
    tg.setBackgroundColor('#080b11');
  }

  let balance = 25;
  let currentItem = { name: 'Сигма Бабич', emoji: '🗿', value: 10 };
  let rotation = 0;
  let isSpinning = false;

  function showToast(text) {
    const t = document.getElementById('toast');
    t.innerText = text;
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); }, 2200);
  }

  function updateUI() {
    document.getElementById('balance').innerText = balance;
    document.getElementById('item-emoji').innerText = currentItem.emoji;
    document.getElementById('item-name').innerText = currentItem.name;
    document.getElementById('item-value').innerText = currentItem.value;
  }

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
    document.getElementById('pane-' + tabName).classList.add('active');
    el.classList.add('active');
  }

  function addCoins(amount) {
    balance += amount;
    showToast(`+${amount} 🟡 добавлено!`);
    updateUI();
  }

  function claimDaily() {
    balance += 50;
    showToast('🎉 Ежедневный бонус +50 🟡 у тебя!');
    updateUI();
  }

  function applyPromo() {
    const input = document.getElementById('promo-input');
    const val = input.value.trim().toUpperCase();
    if (val === 'BRAINROT' || val === 'BABICH' || val === '2026') {
      balance += 100;
      showToast('🚀 Промокод принят! +100 🟡');
      input.value = '';
      updateUI();
    } else {
      showToast('❌ Неверный или просроченный код!');
    }
  }

  function spinUpgrade() {
    if (isSpinning) return;
    if (balance < 5) {
      showToast('⚠️ Не хватает монеток (нужно 5 🟡)!');
      return;
    }

    balance -= 5;
    updateUI();
    isSpinning = true;

    rotation += 1080 + Math.floor(Math.random() * 360);
    document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      const win = Math.random() < 0.5; // 50% шанс
      if (win) {
        currentItem.value *= 2;
        currentItem.name = 'MEGA ' + currentItem.name;
        showToast('🔥 ПОБЕДА! Ценность х2!');
      } else {
        currentItem.value = Math.max(5, Math.floor(currentItem.value / 2));
        showToast('💀 СГОРЕЛО! Ценность упала...');
      }
      isSpinning = false;
      updateUI();
    }, 850);
  }

  updateUI();
</script>
</body>
