<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brainrot Grader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-0: #05070d;
      --bg-1: #0b101b;
      --card: rgba(18, 25, 41, 0.88);
      --card-2: rgba(25, 35, 56, 0.92);
      --border: rgba(148, 163, 184, 0.14);
      --border-hi: rgba(56, 189, 248, 0.45);
      --cyan: #38bdf8;
      --violet: #a855f7;
      --pink: #ec4899;
      --gold: #facc15;
      --green: #22c55e;
      --red: #ef4444;
      --txt: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(168, 85, 247, 0.16), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.16), transparent 45%),
        var(--bg-0);
      color: var(--txt);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(13, 19, 33, 0.96) 0%, rgba(6, 9, 16, 0.99) 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 92px;
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.95);
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(10, 15, 26, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
    }

    .brand-title {
      font-weight: 950;
      font-size: 15px;
      letter-spacing: 0.6px;
      line-height: 1.05;
    }

    .brand-title span {
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .wallet {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 5px 6px 5px 12px;
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .wallet-amt {
      font-weight: 900;
      font-size: 14px;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.25);
    }

    .wallet-plus {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
      transition: transform 0.12s ease;
    }

    .wallet-plus:active {
      transform: scale(0.9);
    }

    /* MAIN */
    .main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .pane {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: popIn 0.22s ease;
    }

    .pane.active {
      display: flex;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .surface {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--txt);
    }

    .pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.28);
    }

    /* UPGRADE WHEEL */
    .stage {
      position: relative;
      width: 188px;
      height: 188px;
      margin: 4px auto 16px;
      display: grid;
      place-items: center;
    }

    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 18px solid var(--txt);
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.65));
      z-index: 6;
    }

    .sector-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--green) 0deg 180deg, rgba(239, 68, 68, 0.28) 180deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 12px), #000 calc(100% - 11px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 12px), #000 calc(100% - 11px));
      box-shadow: 0 0 32px rgba(34, 197, 94, 0.22);
      transition: background 0.25s ease;
    }

    .spinner-arm {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      transition: transform 1.25s cubic-bezier(0.14, 0.88, 0.18, 1);
      z-index: 4;
      pointer-events: none;
    }

    .spinner-arm::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 14px #fff, 0 0 24px var(--cyan);
    }

    .stage-core {
      width: 146px;
      height: 146px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #1e293b, #090d16 78%);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.8);
    }

    .chance-big {
      font-size: 32px;
      font-weight: 950;
      color: var(--green);
      text-shadow: 0 0 18px rgba(34, 197, 94, 0.45);
      line-height: 1;
    }

    .chance-sub {
      margin-top: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* SLOTS */
    .slots {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .slot {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.16s ease;
      min-height: 112px;
      justify-content: center;
    }

    .slot:hover {
      border-color: var(--border-hi);
      transform: translateY(-2px);
    }

    .slot-badge {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      color: var(--muted);
    }

    .slot-badge.target {
      background: rgba(168, 85, 247, 0.18);
      color: #d8b4fe;
    }

    .slot-emo {
      font-size: 30px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    }

    .slot-name {
      font-size: 12px;
      font-weight: 800;
      max-width: 115px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-val {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
    }

    .arrow-mid {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--cyan);
      font-weight: 900;
    }

    /* CHANCE PRESETS */
    .presets {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .preset {
      background: var(--bg-1);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      padding: 9px 0;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .preset.active {
      background: linear-gradient(135deg, rgba(56,189,248,0.22), rgba(168,85,247,0.22));
      border-color: var(--cyan);
      color: #fff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
    }

    /* BUTTONS */
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #05110a;
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 55%, #16a34a 100%);
      box-shadow: 0 10px 26px rgba(34, 197, 94, 0.35), inset 0 1px 0 rgba(255,255,255,0.45);
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
      filter: brightness(0.94);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-neon {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, var(--violet), var(--pink));
      box-shadow: 0 10px 24px rgba(168, 85, 247, 0.32);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .btn-neon:active {
      transform: scale(0.97);
    }

    /* REWARDS */
    .reward-hero {
      background:
        radial-gradient(circle at 80% 15%, rgba(236, 72, 153, 0.25), transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.22), transparent 55%),
        var(--card);
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .promo-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .promo-inp {
      flex: 1;
      background: var(--bg-0);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      outline: none;
      text-transform: uppercase;
    }

    .promo-inp:focus {
      border-color: var(--cyan);
    }

    .promo-go {
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font-weight: 950;
      font-size: 13px;
      color: #060911;
      background: linear-gradient(135deg, var(--gold), #eab308);
      cursor: pointer;
    }

    /* INVENTORY GRID */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .inv-tile {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    /* BOTTOM NAV */
    .dock {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      background: rgba(11, 16, 27, 0.9);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 12px 16px;
      gap: 6px;
      z-index: 40;
    }

    .dock-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 15px;
      padding: 7px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .dock-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.14);
    }

    .dock-ico {
      font-size: 19px;
      line-height: 1;
    }

    /* SHEET MODAL */
    .sheet {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 90;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet.open {
      display: flex;
    }

    .sheet-card {
      width: 100%;
      max-width: 430px;
      background: var(--bg-1);
      border-top: 1px solid var(--border-hi);
      border-radius: 26px 26px 0 0;
      padding: 20px 16px 28px;
      max-height: 72vh;
      overflow-y: auto;
    }

    /* TOAST */
    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--cyan);
      color: #fff;
      padding: 11px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: all 0.24s ease;
      box-shadow: 0 12px 30px rgba(0,0,0,0.65);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🧠</div>
        <div>
          <div class="brand-title">BRAINROT <span>GRADER</span></div>
          <div class="brand-sub">MINI APP EDITION</div>
        </div>
      </div>
      <div class="wallet">
        <span class="wallet-amt">🟡 <span id="bal">50</span></span>
        <button class="wallet-plus" onclick="addCoins(15)" title="+15">+</button>
      </div>
    </header>

    <div id="toast" class="toast"></div>

    <main class="main">
      <!-- АПГРЕЙД -->
      <section id="pane-upgrade" class="pane active">
        <div class="surface">
          <div class="section-head">
            <span class="section-title">Апгрейд станция</span>
            <span class="pill" id="mult-pill">x2.0</span>
          </div>

          <div class="stage">
            <div class="pointer"></div>
            <div class="sector-ring" id="sector-ring"></div>
            <div class="spinner-arm" id="spinner-arm"></div>
            <div class="stage-core">
              <div class="chance-big" id="chance-lbl">50%</div>
              <div class="chance-sub">Шанс успеха</div>
            </div>
          </div>

          <div class="slots">
            <div class="slot" onclick="openSheet('inv')">
              <span class="slot-badge">Инвентарь</span>
              <div class="slot-emo" id="inv-emo">🗿</div>
              <div class="slot-name" id="inv-name">Сигма Бабич</div>
              <div class="slot-val" id="inv-val">10 🟡</div>
            </div>

            <div class="arrow-mid">➜</div>

            <div class="slot" onclick="openSheet('target')">
              <span class="slot-badge target">Цель</span>
              <div class="slot-emo" id="tgt-emo">👑</div>
              <div class="slot-name" id="tgt-name">Мега Бабич</div>
              <div class="slot-val" id="tgt-val">20 🟡</div>
            </div>
          </div>

          <div class="presets">
            <button class="preset" onclick="setMult(2, this)">x2</button>
            <button class="preset" onclick="setMult(5, this)">x5</button>
            <button class="preset" onclick="setMult(10, this)">x10</button>
            <button class="preset" onclick="setPct(25, this)">25%</button>
            <button class="preset active" onclick="setPct(50, this)">50%</button>
            <button class="preset" onclick="setPct(75, this)">75%</button>
          </div>

          <button class="btn-primary" id="spin-btn" onclick="spin()">Крутить апгрейд</button>
        </div>
      </section>

      <!-- НАГРАДЫ -->
      <section id="pane-rewards" class="pane">
        <div class="surface reward-hero" style="text-align:center;">
          <div style="font-size:42px; margin-bottom:8px;">🎁</div>
          <div style="font-size:18px; font-weight:950; margin-bottom:6px;">Ежедневные награды</div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">
            Забирай монеты на крутки и прокачивай редкость в один клик.
          </div>
          <button class="btn-neon" onclick="claimDaily()">Забрать +50 🟡</button>
        </div>

        <div class="surface">
          <div class="section-title" style="margin-bottom:4px;">Промокод</div>
          <div style="font-size:12px; color:var(--muted);">Попробуй код <strong style="color:#fff;">BRAINROT</strong> или <strong style="color:#fff;">BABICH</strong></div>
          <div class="promo-box">
            <input id="promo-inp" class="promo-inp" placeholder="ВВЕДИ КОД..." />
            <button class="promo-go" onclick="usePromo()">ОК</button>
          </div>
        </div>
      </section>

      <!-- ПРОФИЛЬ -->
      <section id="pane-profile" class="pane">
        <div class="surface">
          <div class="section-head">
            <span class="section-title">Твой инвентарь</span>
            <span class="pill" id="inv-cnt">1 шт.</span>
          </div>
          <div class="grid-2" id="inv-grid"></div>
        </div>
      </section>
    </main>

    <nav class="dock">
      <button class="dock-btn active" onclick="goTab('upgrade', this)">
        <span class="dock-ico">⚡</span>
        <span>Апгрейд</span>
      </button>
      <button class="dock-btn" onclick="goTab('rewards', this)">
        <span class="dock-ico">🎁</span>
        <span>Награды</span>
      </button>
      <button class="dock-btn" onclick="goTab('profile', this)">
        <span class="dock-ico">👾</span>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" onclick="closeSheet(event)">
    <div class="sheet-card">
      <div class="section-head">
        <span class="section-title" id="sheet-title">Выбор</span>
        <span class="pill" onclick="document.getElementById('sheet').classList.remove('open')" style="cursor:pointer;">Закрыть</span>
      </div>
      <div class="grid-2" id="sheet-grid"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0a0f1a');
      tg.setBackgroundColor('#05070d');
    }

    const SAVE_KEY = 'brainrot_grader_save_v1';
    const targets = [
      { name: 'Мега Бабич', emo: '👑', val: 20 },
      { name: 'Турбо Танос', emo: '🧤', val: 45 },
      { name: 'Альфа Годжо', emo: '🤞', val: 90 },
      { name: 'Сигма Император', emo: '🗿', val: 180 },
      { name: 'Космический Брейнрот', emo: '🛸', val: 360 }
    ];

    let state = {
      bal: 50,
      chance: 50,
      invIdx: 0,
      tgtIdx: 0,
      inv: [{ name: 'Сигма Бабич', emo: '🗿', val: 10 }]
    };

    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (saved && Array.isArray(saved.inv) && saved.inv.length) {
        state = { ...state, ...saved };
      }
    } catch (_) {}

    let angle = 0;
    let busy = false;
    let mode = 'inv';

    function save() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2100);
    }

    function syncChanceVisual() {
      const deg = (state.chance / 100) * 360;
      document.getElementById('chance-lbl').textContent = state.chance + '%';
      document.getElementById('sector-ring').style.background =
        `conic-gradient(var(--green) 0deg ${deg}deg, rgba(239, 68, 68, 0.26) ${deg}deg 360deg)`;
      const mult = (100 / Math.max(5, state.chance)).toFixed(1);
      document.getElementById('mult-pill').textContent = 'x' + mult;
    }

    function render() {
      document.getElementById('bal').textContent = state.bal;
      document.getElementById('inv-cnt').textContent = state.inv.length + ' шт.';

      const cur = state.inv[state.invIdx] || state.inv[0];
      if (cur) {
        document.getElementById('inv-emo').textContent = cur.emo;
        document.getElementById('inv-name').textContent = cur.name;
        document.getElementById('inv-val').textContent = cur.val + ' 🟡';
      }

      const tgt = targets[state.tgtIdx] || targets[0];
      document.getElementById('tgt-emo').textContent = tgt.emo;
      document.getElementById('tgt-name').textContent = tgt.name;
      document.getElementById('tgt-val').textContent = tgt.val + ' 🟡';

      const grid = document.getElementById('inv-grid');
      grid.innerHTML = state.inv.map((item, i) => `
        <div class="inv-tile">
          <div style="font-size:30px;">${item.emo}</div>
          <div style="font-size:12px;font-weight:800;">${item.name}</div>
          <div style="font-size:11px;font-weight:800;color:var(--gold);">${item.val} 🟡</div>
          <button class="preset ${i === state.invIdx ? 'active' : ''}" style="width:100%;margin-top:4px;" onclick="pickInv(${i})">
            ${i === state.invIdx ? 'Выбран' : 'Выбрать'}
          </button>
        </div>
      `).join('');

      syncChanceVisual();
      save();
    }

    function goTab(name, btn) {
      document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('pane-' + name).classList.add('active');
      btn.classList.add('active');
    }

    function setPct(p, btn) {
      state.chance = p;
      document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      render();
    }

    function setMult(m, btn) {
      state.chance = Math.max(10, Math.min(85, Math.round(100 / m)));
      document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      render();
    }

    function openSheet(type) {
      mode = type;
      const list = type === 'inv' ? state.inv : targets;
      document.getElementById('sheet-title').textContent = type === 'inv' ? 'Твои предметы' : 'Выбор цели';
      document.getElementById('sheet-grid').innerHTML = list.map((item, idx) => `
        <div class="inv-tile" style="cursor:pointer;" onclick="chooseFromSheet(${idx})">
          <div style="font-size:30px;">${item.emo}</div>
          <div style="font-size:12px;font-weight:800;">${item.name}</div>
          <div style="font-size:11px;font-weight:800;color:var(--gold);">${item.val} 🟡</div>
        </div>
      `).join('');
      document.getElementById('sheet').classList.add('open');
    }

    function closeSheet(e) {
      if (e.target.id === 'sheet') e.target.classList.remove('open');
    }

    function chooseFromSheet(idx) {
      if (mode === 'inv') state.invIdx = idx;
      else state.tgtIdx = idx;
      document.getElementById('sheet').classList.remove('open');
      render();
    }

    function pickInv(idx) {
      state.invIdx = idx;
      render();
      toast('Предмет выбран для апгрейда');
    }

    function addCoins(n) {
      state.bal += n;
      toast(`+${n} 🟡 на баланс`);
      render();
    }

    function claimDaily() {
      state.bal += 50;
      toast('🎁 Забрано +50 🟡');
      render();
    }

    function usePromo() {
      const inp = document.getElementById('promo-inp');
      const code = inp.value.trim().toUpperCase();
      if (code === 'BRAINROT' || code === 'BABICH') {
        state.bal += 100;
        inp.value = '';
        toast('🔥 Промокод сработал! +100 🟡');
        render();
      } else {
        toast('❌ Неверный промокод');
      }
    }

    function spin() {
      if (busy) return;
      if (!state.inv.length) {
        toast('Инвентарь пуст — возьми награду!');
        return;
      }
      busy = true;
      document.getElementById('spin-btn').disabled = true;

      const win = (Math.random() * 100) < state.chance;
      const winSpanDeg = (state.chance / 100) * 360;
      const stopAngle = win
        ? 8 + Math.random() * Math.max(8, winSpanDeg - 16)
        : winSpanDeg + 8 + Math.random() * Math.max(8, 360 - winSpanDeg - 16);

      const currentMod = ((angle % 360) + 360) % 360;
      const delta = ((stopAngle - currentMod) + 360) % 360;
      angle += 1080 + delta;
      document.getElementById('spinner-arm').style.transform = `rotate(${angle}deg)`;

      setTimeout(() => {
        if (win) {
          const tgt = targets[state.tgtIdx] || targets[0];
          state.inv.push({ name: tgt.name, emo: tgt.emo, val: tgt.val });
          state.invIdx = state.inv.length - 1;
          toast(`🔥 ЗАЛЕТЕЛО! Получен ${tgt.name}`);
        } else {
          state.inv.splice(state.invIdx, 1);
          if (!state.inv.length) {
            state.inv.push({ name: 'Базовый Бабич', emo: '🗿', val: 5 });
          }
          state.invIdx = 0;
          toast('💀 СЛИВ! Предмет сгорел');
        }
        busy = false;
        document.getElementById('spin-btn').disabled = false;
        render();
      }, 1300);
    }

    render();
  </script>
</body>
</html>
