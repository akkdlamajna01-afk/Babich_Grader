<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brainrot Grader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #12161f;
      --bg-card-2: #181d29;
      --line: rgba(255, 255, 255, 0.08);
      --line-glow: rgba(148, 163, 184, 0.32);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.45);
      --blue: #3b82f6;
      --gold: #facc15;
      --txt: #f1f5f9;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--txt);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Переливающийся градиент в духе UIGradient */
    .uigradients-bg {
      position: fixed;
      inset: -35%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 25%, rgba(148, 163, 184, 0.16), transparent 42%),
        radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.14), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(168, 85, 247, 0.12), transparent 50%),
        linear-gradient(125deg, #090b10 0%, #151924 45%, #0c1018 100%);
      background-size: 200% 200%;
      animation: uiGradientShift 9s ease-in-out infinite alternate;
    }

    @keyframes uiGradientShift {
      0% { transform: translate3d(0%, 0%, 0) rotate(0deg); }
      50% { transform: translate3d(-3%, 2%, 0) rotate(2deg); }
      100% { transform: translate3d(3%, -2%, 0) rotate(-2deg); }
    }

    .app {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: rgba(11, 14, 20, 0.88);
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
    }

    /* Шапка */
    .top {
      position: sticky;
      top: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(13, 17, 25, 0.92);
      border-bottom: 1px solid var(--line);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .burger-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg-card-2);
      color: var(--txt);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .logo-txt {
      font-weight: 950;
      font-size: 17px;
      letter-spacing: 0.7px;
      background: linear-gradient(90deg, #e2e8f0, #94a3b8, #60a5fa, #e2e8f0);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: logoShine 5s linear infinite;
    }

    @keyframes logoShine {
      to { background-position: 250% center; }
    }

    .bal-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bal-box {
      background: #141821;
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 9px;
      padding: 6px 10px;
      font-weight: 900;
      font-size: 13px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .plus-sq {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.45);
    }

    /* Заголовок раздела + Быстро */
    .subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 8px;
    }

    .subhead-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-mark {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #252c3a;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 900;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .fast-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: #cbd5e1;
      cursor: pointer;
    }

    .switch {
      width: 38px;
      height: 20px;
      border-radius: 999px;
      background: #273042;
      position: relative;
      transition: background 0.2s;
      border: 1px solid var(--line);
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #94a3b8;
      transition: transform 0.2s, background 0.2s;
    }

    .fast-toggle.on .switch {
      background: rgba(34, 197, 94, 0.28);
      border-color: var(--green);
    }

    .fast-toggle.on .switch::after {
      transform: translateX(18px);
      background: var(--green);
    }

    /* Неподвижная рулетка + динамический зелёный сектор + крутящаяся стрелка */
    .wheel-stage {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 6px auto 14px;
      display: grid;
      place-items: center;
    }

    .static-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at center, transparent 62%, #1b2232 63%, #111622 92%, #232b3d 100%);
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.75), inset 0 0 18px rgba(148, 163, 184, 0.12);
    }

    /* Зелёная заполненная часть сверху, меняет размер от шанса */
    .green-arc {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(34, 197, 94, 0.92) 0deg var(--win-deg, 180deg),
        rgba(30, 41, 59, 0.25) var(--win-deg, 180deg) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
      filter: drop-shadow(0 0 10px var(--green-glow));
      transition: --win-deg 0.25s ease, background 0.25s ease;
    }

    /* Крутится ТОЛЬКО стрелка */
    .arrow-rotor {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      z-index: 6;
      pointer-events: none;
      transition: transform 1.45s cubic-bezier(0.12, 0.88, 0.16, 1);
    }

    .arrow-rotor.fast {
      transition: transform 0.38s cubic-bezier(0.15, 0.85, 0.2, 1);
    }

    .arrow-pointer {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 22px solid #ffffff;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }

    .center-dial {
      position: relative;
      z-index: 4;
      width: 142px;
      height: 142px;
      border-radius: 50%;
      background: linear-gradient(145deg, #161c28, #0b0e14);
      border: 1px solid rgba(148, 163, 184, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.85);
    }

    .chance-val {
      font-size: 28px;
      font-weight: 950;
      color: var(--green);
      text-shadow: 0 0 16px var(--green-glow);
    }

    .chance-txt {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Карточки Инвентарь / Баланс и Цель */
    .pick-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
    }

    .pick-card {
      background: linear-gradient(160deg, #161b26 0%, #0f131b 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      min-height: 124px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }

    .pick-card:hover {
      border-color: var(--line-glow);
      transform: translateY(-2px);
    }

    .mini-tabs {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .mini-tab {
      flex: 1;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 2px;
      border-radius: 6px;
      background: #1b2230;
      color: #94a3b8;
    }

    .mini-tab.active {
      background: var(--blue);
      color: #fff;
    }

    .target-tag {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #cbd5e1;
    }

    .sq-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #1c2333;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 22px;
      margin: 4px 0;
    }

    .pick-label {
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      text-align: center;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pick-sub {
      font-size: 10px;
      font-weight: 800;
      color: var(--gold);
    }

    .mid-gt {
      font-size: 18px;
      font-weight: 900;
      color: #64748b;
    }

    /* Светящаяся кнопка ПРОКАЧАТЬ */
    .upgrade-btn-wrap {
      padding: 14px 14px 8px;
    }

    .btn-upgrade {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(74, 222, 128, 0.55);
      border-radius: 12px;
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      background-size: 100% 180%;
      color: #ffffff;
      font-size: 18px;
      font-weight: 950;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(34, 197, 94, 0.45),
        0 8px 20px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: btnGlowPulse 2.2s ease-in-out infinite alternate;
      transition: transform 0.1s;
    }

    @keyframes btnGlowPulse {
      0% {
        box-shadow: 0 0 18px rgba(34, 197, 94, 0.35), 0 8px 20px rgba(0, 0, 0, 0.5);
        filter: brightness(1);
      }
      100% {
        box-shadow: 0 0 34px rgba(74, 222, 128, 0.72), 0 8px 24px rgba(34, 197, 94, 0.25);
        filter: brightness(1.08);
      }
    }

    .btn-upgrade:active {
      transform: scale(0.98);
    }

    /* Полоса множителей как на скрине */
    .bar-presets {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      margin: 6px 14px 10px;
      background: #0e121a;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-btn {
      padding: 10px 2px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .bar-btn.active {
      background: rgba(59, 130, 246, 0.24);
      color: #ffffff;
    }

    /* Нижние вкладки: Мои | Желаемые | Магазин */
    .subtabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      margin-top: 4px;
    }

    .subtab {
      padding: 12px 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #94a3b8;
      cursor: pointer;
      position: relative;
    }

    .subtab.active {
      color: #ffffff;
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.08), rgba(148, 163, 184, 0.22));
    }

    .subtab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #93c5fd;
      box-shadow: 0 0 10px #93c5fd;
    }

    .subtab-body {
      padding: 14px;
      min-height: 150px;
    }

    .empty-txt {
      color: #475569;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .item-box {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .small-act {
      width: 100%;
      padding: 7px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #1e2638;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Нижний док */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      background: rgba(12, 15, 22, 0.95);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 8px 12px 14px;
      gap: 8px;
      z-index: 30;
    }

    .dock-item {
      padding: 8px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dock-item.active {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--line);
      color: #fff;
    }

    /* Модалка */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 80;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-bg.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #121722;
      border-top: 1px solid var(--line-glow);
      border-radius: 20px 20px 0 0;
      padding: 18px 14px 26px;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* Блёсточки при победе */
    .sparkles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      top: -20px;
      font-size: 20px;
      animation: sparkleFall var(--dur, 1.8s) linear forwards;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }

    @keyframes sparkleFall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg) scale(0.7);
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--drift, 40px), 105vh, 0) rotate(540deg) scale(1.25);
        opacity: 0;
      }
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #182030;
      border: 1px solid var(--green);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900;
      z-index: 160;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="uigradients-bg"></div>
  <div class="sparkles-layer" id="sparkles"></div>
  <div class="toast" id="toast"></div>

  <div class="app">
    <header class="top">
      <div class="top-left">
        <button class="burger-btn" onclick="openSheet('rewards')">☰</button>
        <div class="logo-txt">BRAINROT GRADER</div>
      </div>
      <div class="bal-wrap">
        <div class="bal-box">🟡 <span id="bal">10</span></div>
        <button class="plus-sq" onclick="addCoins(10)">+</button>
      </div>
    </header>

    <div id="view-main">
      <div class="subhead">
        <div class="subhead-title">
          Апгрейдер
          <span class="q-mark" onclick="showToast('Зелёная дуга = шанс успеха. Крутится стрелка!')">?</span>
        </div>
        <div class="fast-toggle" id="fast-toggle" onclick="toggleFast()">
          <div class="switch"></div>
          <span>Быстро</span>
        </div>
      </div>

      <!-- Рулетка стоит на месте; зелёная часть сверху меняется; крутится стрелка -->
      <div class="wheel-stage">
        <div class="static-ring"></div>
        <div class="green-arc" id="green-arc"></div>
        <div class="arrow-rotor" id="arrow-rotor">
          <div class="arrow-pointer"></div>
        </div>
        <div class="center-dial">
          <div class="chance-val" id="chance-val">50%</div>
          <div class="chance-txt">ШАНС</div>
        </div>
      </div>

      <!-- Инвентарь / Баланс -> ЦЕЛЬ -->
      <div class="pick-row">
        <div class="pick-card" onclick="openSheet('inv')">
          <div class="mini-tabs">
            <div class="mini-tab active">Инвентарь</div>
            <div class="mini-tab">Баланс</div>
          </div>
          <div class="sq-icon" id="inv-emo">↓</div>
          <div class="pick-label" id="inv-lbl">Выбрать из инвентаря</div>
          <div class="pick-sub" id="inv-cost">0 🟡</div>
        </div>

        <div class="mid-gt">&gt;</div>

        <div class="pick-card" onclick="openSheet('target')">
          <div class="target-tag">ЦЕЛЬ</div>
          <div class="sq-icon" id="tgt-emo">+</div>
          <div class="pick-label" id="tgt-lbl">Выбрать цель</div>
          <div class="pick-sub" id="tgt-cost">20 🟡</div>
        </div>
      </div>

      <!-- Светящаяся кнопка ПРОКАЧАТЬ -->
      <div class="upgrade-btn-wrap">
        <button class="btn-upgrade" id="btn-upgrade" onclick="runUpgrade()">ПРОКАЧАТЬ</button>
      </div>

      <!-- Быстрые пресеты -->
      <div class="bar-presets">
        <button class="bar-btn" onclick="pickMult(2, this)">x2</button>
        <button class="bar-btn" onclick="pickMult(5, this)">x5</button>
        <button class="bar-btn" onclick="pickMult(10, this)">x10</button>
        <button class="bar-btn" onclick="pickPct(30, this)">30%</button>
        <button class="bar-btn active" onclick="pickPct(50, this)">50%</button>
        <button class="bar-btn" onclick="pickPct(75, this)">75%</button>
      </div>

      <!-- Нижние вкладки: Мои | Желаемые | Магазин -->
      <div class="subtabs">
        <div class="subtab active" onclick="setSubTab('mine', this)">Мои</div>
        <div class="subtab" onclick="setSubTab('wish', this)">Желаемые</div>
        <div class="subtab" onclick="setSubTab('shop', this)">🛍️ Магазин</div>
      </div>
      <div class="subtab-body" id="subtab-body"></div>
    </div>

    <div class="bottom-dock">
      <button class="dock-item active" onclick="goMainView(this)">⚡ Апгрейд</button>
      <button class="dock-item" onclick="openSheet('rewards')">🎁 Награды</button>
    </div>
  </div>

  <div class="modal-bg" id="modal-bg" onclick="closeModalBg(event)">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0d1119');
      tg.setBackgroundColor('#0a0c10');
    }

    const SHOP_ITEMS = [
      { id: 'b1', name: 'Бабич Обычный', emo: '🗿', val: 10 },
      { id: 'b2', name: 'Сигма Бабич', emo: '😎', val: 25 },
      { id: 'b3', name: 'Мега Бабич', emo: '👑', val: 50 },
      { id: 'b4', name: 'Брейнрот Лорд', emo: '🧠', val: 120 }
    ];

    let state = {
      bal: 10,
      chance: 50,
      fast: false,
      subTab: 'mine',
      inv: [],
      wish: [],
      selectedInv: null,
      selectedTarget: SHOP_ITEMS[1]
    };

    try {
      const raw = JSON.parse(localStorage.getItem('brainrot_grader_v2'));
      if (raw) state = { ...state, ...raw };
    } catch (_) {}

    let arrowDeg = 0;
    let spinning = false;
    let audioCtx = null;

    function save() {
      try { localStorage.setItem('brainrot_grader_v2', JSON.stringify(state)); } catch (_) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), 2100);
    }

    /* Звук победы через Web Audio API */
    function playWinSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const start = audioCtx.currentTime + idx * 0.08;
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 0.36);
        });
      } catch (_) {}
    }

    /* Блёсточки по всему экрану при победе */
    function spawnSparkles() {
      const layer = document.getElementById('sparkles');
      const glyphs = ['✨', '⭐', '🌟', '💎', '⚡'];
      for (let i = 0; i < 36; i++) {
        const sp = document.createElement('div');
        sp.className = 'sparkle';
        sp.textContent = glyphs[i % glyphs.length];
        sp.style.left = Math.random() * 100 + '%';
        sp.style.setProperty('--drift', (Math.random() * 140 - 70) + 'px');
        sp.style.setProperty('--dur', (1.2 + Math.random() * 1.1) + 's');
        sp.style.animationDelay = (Math.random() * 0.25) + 's';
        layer.appendChild(sp);
        setTimeout(() => sp.remove(), 2500);
      }
    }

    function syncChance() {
      const deg = (state.chance / 100) * 360;
      document.getElementById('chance-val').textContent = state.chance + '%';
      document.getElementById('green-arc').style.setProperty('--win-deg', deg + 'deg');
      document.getElementById('green-arc').style.background =
        `conic-gradient(from 0deg, rgba(34, 197, 94, 0.92) 0deg ${deg}deg, rgba(30, 41, 59, 0.22) ${deg}deg 360deg)`;
    }

    function renderSubTab() {
      const body = document.getElementById('subtab-body');
      document.querySelectorAll('.subtab').forEach(t => {
        const key = t.textContent.includes('Мои') ? 'mine' : t.textContent.includes('Желаемые') ? 'wish' : 'shop';
        t.classList.toggle('active', key === state.subTab);
      });

      if (state.subTab === 'mine') {
        if (!state.inv.length) {
          body.innerHTML = '<div class="empty-txt">Инвентарь<br>пуст</div>';
          return;
        }
        body.innerHTML = `<div class="cards-grid">${state.inv.map((it, idx) => `
          <div class="item-box">
            <div style="font-size:28px;">${it.emo}</div>
            <div style="font-size:12px;font-weight:800;">${it.name}</div>
            <div style="font-size:11px;color:var(--gold);font-weight:800;">${it.val} 🟡</div>
            <button class="small-act" onclick="pickForUpgrade(${idx})">В апгрейд</button>
          </div>
        `).join('')}</div>`;
      } else if (state.subTab === 'wish') {
        if (!state.wish.length) {
          body.innerHTML = '<div class="empty-txt">Желаемых пока нет — выбери цель сверху или в магазине</div>';
          return;
        }
        body.innerHTML = `<div class="cards-grid">${state.wish.map(it => `
          <div class="item-box">
            <div style="font-size:28px;">${it.emo}</div>
            <div style="font-size:12px;font-weight:800;">${it.name}</div>
            <div style="font-size:11px;color:var(--gold);font-weight:800;">${it.val} 🟡</div>
            <button class="small-act" onclick="setTarget(SHOP_ITEMS.find(x=>x.id==='${it.id}') || state.wish[0])">Поставить в цель</button>
          </div>
        `).join('')}</div>`;
      } else {
        body.innerHTML = `<div class="cards-grid">${SHOP_ITEMS.map(it => `
          <div class="item-box">
            <div style="font-size:28px;">${it.emo}</div>
            <div style="font-size:12px;font-weight:800;">${it.name}</div>
            <div style="font-size:11px;color:var(--gold);font-weight:800;">${it.val} 🟡</div>
            <button class="small-act" onclick="buyShop('${it.id}')">Купить (${it.val} 🟡)</button>
          </div>
        `).join('')}</div>`;
      }
    }

    function renderAll() {
      document.getElementById('bal').textContent = state.bal;
      document.getElementById('fast-toggle').classList.toggle('on', state.fast);
      document.getElementById('arrow-rotor').classList.toggle('fast', state.fast);

      if (state.selectedInv) {
        document.getElementById('inv-emo').textContent = state.selectedInv.emo;
        document.getElementById('inv-lbl').textContent = state.selectedInv.name;
        document.getElementById('inv-cost').textContent = state.selectedInv.val + ' 🟡';
      } else {
        document.getElementById('inv-emo').textContent = '↓';
        document.getElementById('inv-lbl').textContent = 'Выбрать из инвентаря';
        document.getElementById('inv-cost').textContent = 'Ставка: 5 🟡';
      }

      if (state.selectedTarget) {
        document.getElementById('tgt-emo').textContent = state.selectedTarget.emo;
        document.getElementById('tgt-lbl').textContent = state.selectedTarget.name;
        document.getElementById('tgt-cost').textContent = state.selectedTarget.val + ' 🟡';
      } else {
        document.getElementById('tgt-emo').textContent = '+';
        document.getElementById('tgt-lbl').textContent = 'Выбрать цель';
        document.getElementById('tgt-cost').textContent = '—';
      }

      syncChance();
      renderSubTab();
      save();
    }

    function addCoins(n) {
      state.bal += n;
      showToast(`+${n} 🟡`);
      renderAll();
    }

    function toggleFast() {
      state.fast = !state.fast;
      renderAll();
    }

    function pickPct(p, btn) {
      state.chance = p;
      document.querySelectorAll('.bar-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      syncChance();
      save();
    }

    function pickMult(m, btn) {
      state.chance = Math.max(10, Math.min(85, Math.round(100 / m)));
      document.querySelectorAll('.bar-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      syncChance();
      save();
    }

    function setSubTab(tab) {
      state.subTab = tab;
      renderSubTab();
      save();
    }

    function buyShop(id) {
      const item = SHOP_ITEMS.find(x => x.id === id);
      if (!item) return;
      if (state.bal < item.val) {
        showToast('Не хватает монет! Жми +');
        return;
      }
      state.bal -= item.val;
      state.inv.push({ ...item, uid: Date.now() + Math.random() });
      if (!state.selectedInv) state.selectedInv = state.inv[state.inv.length - 1];
      showToast(`Куплено: ${item.name}`);
      renderAll();
    }

    function pickForUpgrade(idx) {
      state.selectedInv = state.inv[idx];
      showToast(`Выбран: ${state.selectedInv.name}`);
      renderAll();
    }

    function setTarget(item) {
      state.selectedTarget = item;
      if (!state.wish.some(w => w.id === item.id)) {
        state.wish.push(item);
      }
      document.getElementById('modal-bg').classList.remove('open');
      showToast(`Цель: ${item.name}`);
      renderAll();
    }

    function openSheet(kind) {
      const box = document.getElementById('modal-box');
      if (kind === 'inv') {
        box.innerHTML = `
          <div style="font-weight:900;font-size:15px;margin-bottom:10px;">Твой инвентарь</div>
          ${state.inv.length ? `<div class="cards-grid">${state.inv.map((it, i) => `
            <div class="item-box" onclick="chooseInv(${i})" style="cursor:pointer;">
              <div style="font-size:28px;">${it.emo}</div>
              <div style="font-size:12px;font-weight:800;">${it.name}</div>
              <div style="font-size:11px;color:var(--gold);font-weight:800;">${it.val} 🟡</div>
            </div>
          `).join('')}</div>` : `<div class="empty-txt">Инвентарь пуст — купи предмет в Магазине или крути за 5 🟡.</div>`}
        `;
      } else if (kind === 'target') {
        box.innerHTML = `
          <div style="font-weight:900;font-size:15px;margin-bottom:10px;">Выбрать цель</div>
          <div class="cards-grid">${SHOP_ITEMS.map(it => `
            <div class="item-box" onclick='setTarget(${JSON.stringify(it)})' style="cursor:pointer;">
              <div style="font-size:28px;">${it.emo}</div>
              <div style="font-size:12px;font-weight:800;">${it.name}</div>
              <div style="font-size:11px;color:var(--gold);font-weight:800;">${it.val} 🟡</div>
            </div>
          `).join('')}</div>
        `;
      } else {
        box.innerHTML = `
          <div style="font-weight:900;font-size:15px;margin-bottom:8px;">🎁 Награды</div>
          <div style="font-size:12px;color:#94a3b8;margin-bottom:12px;">Забирай монеты для прокачки и тестов</div>
          <button class="btn-upgrade" style="padding:12px;font-size:14px;" onclick="addCoins(50)">ЗАБРАТЬ +50 🟡</button>
        `;
      }
      document.getElementById('modal-bg').classList.add('open');
    }

    function chooseInv(i) {
      state.selectedInv = state.inv[i];
      document.getElementById('modal-bg').classList.remove('open');
      renderAll();
    }

    function closeModalBg(e) {
      if (e.target.id === 'modal-bg') e.target.classList.remove('open');
    }

    function goMainView(btn) {
      document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
      btn.classList.add('active');
    }

    function runUpgrade() {
      if (spinning) return;
      if (!state.selectedInv) {
        if (state.bal < 5) {
          showToast('Не хватает 5 🟡! Нажми +');
          return;
        }
        state.bal -= 5;
      }

      spinning = true;
      const win = (Math.random() * 100) < state.chance;
      const winSpan = (state.chance / 100) * 360;
      const targetDeg = win
        ? 6 + Math.random() * Math.max(6, winSpan - 12)
        : winSpan + 6 + Math.random() * Math.max(6, 360 - winSpan - 12);

      const curMod = ((arrowDeg % 360) + 360) % 360;
      const delta = ((targetDeg - curMod) + 360) % 360;
      const extraTurns = state.fast ? 360 : 1080;
      arrowDeg += extraTurns + delta;
      document.getElementById('arrow-rotor').style.transform = `rotate(${arrowDeg}deg)`;

      const waitMs = state.fast ? 420 : 1500;
      setTimeout(() => {
        if (win) {
          const reward = state.selectedTarget || SHOP_ITEMS[0];
          state.inv.push({ ...reward, uid: Date.now() + Math.random() });
          if (!state.wish.some(w => w.id === reward.id)) state.wish.push(reward);
          playWinSound();
          spawnSparkles();
          showToast(`✨ ПОБЕДА! ${reward.name}`);
        } else {
          if (state.selectedInv) {
            state.inv = state.inv.filter(x => x !== state.selectedInv);
            state.selectedInv = state.inv[0] || null;
          }
          showToast('💀 Мимо! Попробуй ещё раз');
        }
        spinning = false;
        renderAll();
      }, waitMs);
    }

    renderAll();
  </script>
</body>
</html>
