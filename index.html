<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BABICH--GRADER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-base: #0c0e12;
      --bg-surface: #141820;
      --bg-elevated: #1b202b;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(203, 213, 225, 0.26);
      --text-main: #f1f5f9;
      --text-dim: #94a3b8;
      --accent-green: #22c55e;
      --accent-green-glow: rgba(34, 197, 94, 0.42);
      --accent-silver: #cbd5e1;
      --accent-gold: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, rgba(148, 163, 184, 0.14), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(100, 116, 139, 0.14), transparent 45%),
        linear-gradient(135deg, #090b0e 0%, #161a23 50%, #0b0d11 100%);
      background-size: 220% 220%;
      animation: greyShift 11s ease-in-out infinite alternate;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    @keyframes greyShift {
      0% { background-position: 0% 20%; }
      50% { background-position: 100% 60%; }
      100% { background-position: 20% 100%; }
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(20, 24, 32, 0.95) 0%, rgba(11, 13, 18, 0.98) 100%);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding-bottom: 82px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
    }

    /* TOPBAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: rgba(16, 20, 28, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #e2e8f0, #94a3b8, #f8fafc, #94a3b8);
      background-size: 240% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleSweep 6s linear infinite;
    }

    @keyframes titleSweep {
      to { background-position: 240% center; }
    }

    .wallet {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wallet-val {
      background: var(--bg-elevated);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .wallet-add {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--border-bright);
      background: linear-gradient(180deg, #334155, #1e293b);
      color: var(--text-main);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .wallet-add:active {
      transform: scale(0.94);
    }

    /* MAIN */
    .main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .pane {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .pane.active {
      display: flex;
    }

    .panel {
      background: linear-gradient(165deg, rgba(28, 34, 46, 0.92), rgba(16, 20, 28, 0.95));
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent-silver);
    }

    .tag {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
    }

    /* WHEEL: неподвижный круг, сверху динамическая зелёная дуга, крутится только стрелка */
    .wheel-wrap {
      position: relative;
      width: 214px;
      height: 214px;
      margin: 6px auto 16px;
      display: grid;
      place-items: center;
    }

    .wheel-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at center, transparent 63%, #1e2430 64%, #11151d 94%, #293244 100%);
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.75), inset 0 0 16px rgba(255, 255, 255, 0.04);
    }

    .wheel-green-zone {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(34, 197, 94, 0.92) 0deg 180deg,
        rgba(51, 65, 85, 0.25) 180deg 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 14px), #000 calc(100% - 13px));
      filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.35));
      transition: background 0.25s ease;
    }

    .arrow-spinner {
      position: absolute;
      inset: 1px;
      border-radius: 50%;
      z-index: 6;
      pointer-events: none;
      will-change: transform;
    }

    .arrow-tip {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 22px solid #f8fafc;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.75));
    }

    .wheel-center {
      position: relative;
      z-index: 4;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      background: linear-gradient(160deg, #1b212d, #0d1016);
      border: 1px solid var(--border-bright);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.85);
    }

    .chance-num {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent-green);
      text-shadow: 0 0 14px var(--accent-green-glow);
    }

    .chance-caption {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* SLOTS */
    .slots {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .slot {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 11px 8px;
      min-height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }

    .slot:hover {
      border-color: var(--border-bright);
      transform: translateY(-1px);
    }

    .slot-role {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .pic-frame {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #10141c;
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-dim);
      text-align: center;
    }

    .pic-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slot-name {
      font-size: 12px;
      font-weight: 800;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-price {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .sep {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-dim);
    }

    /* PRESETS */
    .presets {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .preset-btn {
      padding: 9px 2px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-base);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .preset-btn.active {
      background: #273042;
      border-color: var(--accent-silver);
      color: var(--text-main);
    }

    /* GLOWING UPGRADE BUTTON */
    .btn-roll {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid rgba(134, 239, 172, 0.55);
      background: linear-gradient(90deg, #16a34a 0%, #22c55e 45%, #4ade80 50%, #22c55e 55%, #15803d 100%);
      background-size: 220% 100%;
      color: #06130a;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 24px var(--accent-green-glow), 0 8px 22px rgba(0, 0, 0, 0.55);
      animation: rollSheen 3.2s linear infinite;
      transition: transform 0.12s ease;
    }

    @keyframes rollSheen {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .btn-roll:active {
      transform: scale(0.98);
    }

    .btn-roll:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* LISTS */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .btn-sec {
      width: 100%;
      padding: 8px;
      border-radius: 9px;
      border: 1px solid var(--border-bright);
      background: linear-gradient(180deg, #2b3446, #1c222f);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-sec:active {
      transform: scale(0.97);
    }

    .inp {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      outline: none;
      text-transform: uppercase;
    }

    .inp:focus {
      border-color: var(--accent-silver);
    }

    /* BOTTOM NAV */
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      background: rgba(14, 17, 24, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 10px 15px;
      gap: 6px;
      z-index: 30;
    }

    .nav-btn {
      padding: 9px 6px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--bg-elevated);
      border-color: var(--border-bright);
      color: var(--text-main);
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 80;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-bright);
      border-radius: 20px 20px 0 0;
      padding: 18px 14px 26px;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* SPARKLES */
    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 140;
      overflow: hidden;
    }

    .glint {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1, #4ade80);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      animation: glintFall var(--t, 2s) linear forwards;
    }

    @keyframes glintFall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg) scale(0.6);
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--dx, 50px), 105vh, 0) rotate(720deg) scale(1.2);
        opacity: 0;
      }
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: var(--bg-elevated);
      border: 1px solid var(--border-bright);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="sparkles" id="sparkles"></div>
  <div class="toast" id="toast"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">BABICH--GRADER</div>
      <div class="wallet">
        <div class="wallet-val"><span id="bal">25</span> МОНЕТ</div>
        <button class="wallet-add" onclick="addCoins(5)" title="+5 монет">+</button>
      </div>
    </header>

    <main class="main">
      <!-- ВКЛАДКА 1: АПГРЕЙД -->
      <section id="pane-upgrade" class="pane active">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Апгрейдер</span>
            <span class="tag" id="mult-tag">x2.0</span>
          </div>

          <div class="wheel-wrap">
            <div class="wheel-base"></div>
            <div class="wheel-green-zone" id="green-zone"></div>
            <div class="arrow-spinner" id="arrow-spinner">
              <div class="arrow-tip"></div>
            </div>
            <div class="wheel-center">
              <div class="chance-num" id="chance-num">50%</div>
              <div class="chance-caption">Шанс</div>
            </div>
          </div>

          <div class="slots">
            <div class="slot" onclick="openModal('inv')">
              <div class="slot-role">Инвентарь</div>
              <div class="pic-frame" id="slot-inv-pic">ФОТО</div>
              <div class="slot-name" id="slot-inv-name">Бабич</div>
              <div class="slot-price" id="slot-inv-val">5 МОНЕТ</div>
            </div>

            <div class="sep">&gt;</div>

            <div class="slot" onclick="openModal('target')">
              <div class="slot-role">Цель</div>
              <div class="pic-frame" id="slot-tgt-pic">ФОТО</div>
              <div class="slot-name" id="slot-tgt-name">Сигма Бабич</div>
              <div class="slot-price" id="slot-tgt-val">10 МОНЕТ</div>
            </div>
          </div>

          <div class="presets">
            <button class="preset-btn" onclick="setMult(2, this)">x2</button>
            <button class="preset-btn" onclick="setMult(5, this)">x5</button>
            <button class="preset-btn" onclick="setMult(10, this)">x10</button>
            <button class="preset-btn" onclick="setChance(30, this)">30%</button>
            <button class="preset-btn active" onclick="setChance(50, this)">50%</button>
            <button class="preset-btn" onclick="setChance(75, this)">75%</button>
          </div>

          <button class="btn-roll" id="roll-btn" onclick="startSpin()">ПРОКАЧАТЬ</button>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Бабичи (база — 5 монет)</span>
            <span class="tag">КАТАЛОГ</span>
          </div>
          <div class="grid-2" id="catalog-grid"></div>
        </div>
      </section>

      <!-- ВКЛАДКА 2: ПРОФИЛЬ -->
      <section id="pane-profile" class="pane">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Мой инвентарь</span>
            <span class="tag" id="inv-count">0 ШТ.</span>
          </div>
          <div id="inv-list"></div>
        </div>
      </section>

      <!-- ВКЛАДКА 3: НАГРАДЫ -->
      <section id="pane-rewards" class="pane">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Награды</span>
            <span class="tag">БОНУС</span>
          </div>
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">
            Забери монеты для прокачки Бабичей в апгрейдере.
          </div>
          <button class="btn-sec" style="padding:11px;font-size:12px;" onclick="addCoins(25)">ПОЛУЧИТЬ +25 МОНЕТ</button>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Промокод</span>
            <span class="tag">BABICH</span>
          </div>
          <div style="display:flex;gap:8px;">
            <input class="inp" id="promo-inp" placeholder="ВВЕДИ КОД" />
            <button class="btn-sec" style="width:auto;padding:0 16px;" onclick="claimPromo()">ОК</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="nav">
      <button class="nav-btn active" onclick="switchTab('upgrade', this)">АПГРЕЙД</button>
      <button class="nav-btn" onclick="switchTab('profile', this)">ПРОФИЛЬ</button>
      <button class="nav-btn" onclick="switchTab('rewards', this)">НАГРАДЫ</button>
    </nav>
  </div>

  <div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-sheet" id="modal-sheet"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#10141c');
      tg.setBackgroundColor('#0c0e12');
    }

    const BABICH_CATALOG = [
      { id: 'babich_1', name: 'Бабич', val: 5, img: 'babich.jpg' },
      { id: 'babich_2', name: 'Сигма Бабич', val: 10, img: 'babich_sigma.jpg' },
      { id: 'babich_3', name: 'Турбо Бабич', val: 20, img: 'babich_turbo.jpg' },
      { id: 'babich_4', name: 'Мега Бабич', val: 40, img: 'babich_mega.jpg' },
      { id: 'babich_5', name: 'Ультра Бабич', val: 80, img: 'babich_ultra.jpg' },
      { id: 'babich_6', name: 'Король Бабичей', val: 160, img: 'babich_king.jpg' }
    ];

    const SAVE_KEY = 'babich_grader_save_v3';

    let state = {
      bal: 25,
      chance: 50,
      inv: [
        { uid: 1, id: 'babich_1', name: 'Бабич', val: 5, img: 'babich.jpg' }
      ],
      selectedInvUid: 1,
      targetId: 'babich_2'
    };

    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (saved && Array.isArray(saved.inv)) {
        state = { ...state, ...saved };
      }
    } catch (_) {}

    let isSpinning = false;
    let currentAngle = 0;
    let audioCtx = null;

    function persist() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function notify(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(notify._t);
      notify._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function renderPic(container, item) {
      if (!item || !item.img) {
        container.innerHTML = 'ФОТО';
        return;
      }
      const img = document.createElement('img');
      img.src = item.img;
      img.alt = item.name;
      img.onload = () => {
        container.innerHTML = '';
        container.appendChild(img);
      };
      img.onerror = () => {
        container.textContent = 'ФОТО';
      };
    }

    function playWinFanfare() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const freqs = [440, 554.37, 659.25, 880];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = f;
          const t0 = audioCtx.currentTime + i * 0.085;
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.38);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.4);
        });
      } catch (_) {}
    }

    function launchSparkles() {
      const wrap = document.getElementById('sparkles');
      for (let i = 0; i < 42; i++) {
        const g = document.createElement('div');
        g.className = 'glint';
        g.style.left = (Math.random() * 100) + '%';
        g.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
        g.style.setProperty('--t', (1.4 + Math.random() * 1.1) + 's');
        g.style.animationDelay = (Math.random() * 0.3) + 's';
        wrap.appendChild(g);
        setTimeout(() => g.remove(), 2700);
      }
    }

    function syncArc() {
      const deg = (state.chance / 100) * 360;
      document.getElementById('chance-num').textContent = state.chance + '%';
      document.getElementById('green-zone').style.background =
        `conic-gradient(from 0deg, rgba(34, 197, 94, 0.92) 0deg ${deg}deg, rgba(51, 65, 85, 0.25) ${deg}deg 360deg)`;
      document.getElementById('mult-tag').textContent = 'x' + (100 / Math.max(5, state.chance)).toFixed(1);
    }

    function renderAll() {
      document.getElementById('bal').textContent = state.bal;
      document.getElementById('inv-count').textContent = state.inv.length + ' ШТ.';

      const selInv = state.inv.find(x => x.uid === state.selectedInvUid) || state.inv[0] || null;
      if (selInv) {
        state.selectedInvUid = selInv.uid;
        document.getElementById('slot-inv-name').textContent = selInv.name;
        document.getElementById('slot-inv-val').textContent = selInv.val + ' МОНЕТ';
        renderPic(document.getElementById('slot-inv-pic'), selInv);
      } else {
        document.getElementById('slot-inv-name').textContent = 'Нет предмета';
        document.getElementById('slot-inv-val').textContent = 'Ставка 5 МОНЕТ';
        document.getElementById('slot-inv-pic').textContent = 'ФОТО';
      }

      const tgt = BABICH_CATALOG.find(x => x.id === state.targetId) || BABICH_CATALOG[1];
      document.getElementById('slot-tgt-name').textContent = tgt.name;
      document.getElementById('slot-tgt-val').textContent = tgt.val + ' МОНЕТ';
      renderPic(document.getElementById('slot-tgt-pic'), tgt);

      const catEl = document.getElementById('catalog-grid');
      catEl.innerHTML = BABICH_CATALOG.map(item => `
        <div class="card-item">
          <div class="pic-frame" data-cat-pic="${item.id}">ФОТО</div>
          <div style="font-size:12px;font-weight:800;">${item.name}</div>
          <div style="font-size:11px;font-weight:800;color:var(--accent-gold);">${item.val} МОНЕТ</div>
          <button class="btn-sec" onclick="buyBabich('${item.id}')">Купить (${item.val})</button>
          <button class="btn-sec" onclick="pickTarget('${item.id}')">В цель</button>
        </div>
      `).join('');

      BABICH_CATALOG.forEach(item => {
        const box = catEl.querySelector(`[data-cat-pic="${item.id}"]`);
        if (box) renderPic(box, item);
      });

      const invEl = document.getElementById('inv-list');
      if (!state.inv.length) {
        invEl.innerHTML = '<div style="font-size:13px;color:var(--text-dim);">Инвентарь пуст</div>';
      } else {
        invEl.innerHTML = `<div class="grid-2">${state.inv.map(item => `
          <div class="card-item">
            <div class="pic-frame" data-inv-pic="${item.uid}">ФОТО</div>
            <div style="font-size:12px;font-weight:800;">${item.name}</div>
            <div style="font-size:11px;font-weight:800;color:var(--accent-gold);">${item.val} МОНЕТ</div>
            <button class="btn-sec" onclick="selectInv(${item.uid})">${item.uid === state.selectedInvUid ? 'Выбран' : 'Выбрать'}</button>
          </div>
        `).join('')}</div>`;
        state.inv.forEach(item => {
          const box = invEl.querySelector(`[data-inv-pic="${item.uid}"]`);
          if (box) renderPic(box, item);
        });
      }

      syncArc();
      persist();
    }

    function switchTab(name, btn) {
      document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('pane-' + name).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    function setChance(pct, btn) {
      state.chance = pct;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      syncArc();
      persist();
    }

    function setMult(mult, btn) {
      state.chance = Math.max(10, Math.min(85, Math.round(100 / mult)));
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      syncArc();
      persist();
    }

    function addCoins(n) {
      state.bal += n;
      notify('+' + n + ' монет');
      renderAll();
    }

    function claimPromo() {
      const inp = document.getElementById('promo-inp');
      const code = inp.value.trim().toUpperCase();
      if (code === 'BABICH' || code === 'GRADER') {
        state.bal += 50;
        inp.value = '';
        notify('Промокод активирован: +50 монет');
        renderAll();
      } else {
        notify('Неверный промокод');
      }
    }

    function buyBabich(id) {
      const item = BABICH_CATALOG.find(x => x.id === id);
      if (!item) return;
      if (state.bal < item.val) {
        notify('Недостаточно монет');
        return;
      }
      state.bal -= item.val;
      const owned = { uid: Date.now() + Math.floor(Math.random() * 10000), id: item.id, name: item.name, val: item.val, img: item.img };
      state.inv.push(owned);
      state.selectedInvUid = owned.uid;
      notify('Куплено: ' + item.name);
      renderAll();
    }

    function pickTarget(id) {
      state.targetId = id;
      const tgt = BABICH_CATALOG.find(x => x.id === id);
      notify('Цель: ' + (tgt ? tgt.name : id));
      renderAll();
    }

    function selectInv(uid) {
      state.selectedInvUid = uid;
      notify('Предмет выбран для апгрейда');
      renderAll();
    }

    function openModal(type) {
      const sheet = document.getElementById('modal-sheet');
      if (type === 'inv') {
        sheet.innerHTML = `
          <div class="panel-head">
            <span class="panel-title">Выбор из инвентаря</span>
            <span class="tag" style="cursor:pointer;" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</span>
          </div>
          ${state.inv.length ? `<div class="grid-2">${state.inv.map(it => `
            <div class="card-item" style="cursor:pointer;" onclick="selectInv(${it.uid}); document.getElementById('modal').classList.remove('open');">
              <div class="pic-frame" data-m-pic="${it.uid}">ФОТО</div>
              <div style="font-size:12px;font-weight:800;">${it.name}</div>
              <div style="font-size:11px;color:var(--accent-gold);font-weight:800;">${it.val} МОНЕТ</div>
            </div>
          `).join('')}</div>` : `<div style="font-size:13px;color:var(--text-dim);">Инвентарь пуст. Купи Бабича в каталоге.</div>`}
        `;
        state.inv.forEach(it => {
          const box = sheet.querySelector(`[data-m-pic="${it.uid}"]`);
          if (box) renderPic(box, it);
        });
      } else {
        sheet.innerHTML = `
          <div class="panel-head">
            <span class="panel-title">Выбор цели</span>
            <span class="tag" style="cursor:pointer;" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</span>
          </div>
          <div class="grid-2">${BABICH_CATALOG.map(it => `
            <div class="card-item" style="cursor:pointer;" onclick="pickTarget('${it.id}'); document.getElementById('modal').classList.remove('open');">
              <div class="pic-frame" data-t-pic="${it.id}">ФОТО</div>
              <div style="font-size:12px;font-weight:800;">${it.name}</div>
              <div style="font-size:11px;color:var(--accent-gold);font-weight:800;">${it.val} МОНЕТ</div>
            </div>
          `).join('')}</div>
        `;
        BABICH_CATALOG.forEach(it => {
          const box = sheet.querySelector(`[data-t-pic="${it.id}"]`);
          if (box) renderPic(box, it);
        });
      }
      document.getElementById('modal').classList.add('open');
    }

    function closeModal(e) {
      if (e.target.id === 'modal') {
        document.getElementById('modal').classList.remove('open');
      }
    }

    /* Плавный разгон, ровный проход и плавное торможение стрелки на 7 секунд */
    function animateArrowTo(finalAngle, durationMs, onDone) {
      const spinner = document.getElementById('arrow-spinner');
      const startAngle = currentAngle;
      const totalDelta = finalAngle - startAngle;
      const startTime = performance.now();

      function easeInOutQuint(t) {
        return t < 0.5
          ? 16 * t * t * t * t * t
          : 1 - Math.pow(-2 * t + 2, 5) / 2;
      }

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);
        const eased = easeInOutQuint(progress);
        currentAngle = startAngle + totalDelta * eased;
        spinner.style.transform = `rotate(${currentAngle}deg)`;

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          currentAngle = finalAngle;
          spinner.style.transform = `rotate(${currentAngle}deg)`;
          if (onDone) onDone();
        }
      }

      requestAnimationFrame(frame);
    }

    function startSpin() {
      if (isSpinning) return;
      const selInv = state.inv.find(x => x.uid === state.selectedInvUid) || null;

      if (!selInv && state.bal < 5) {
        notify('Не хватает 5 монет');
        return;
      }

      if (!selInv) {
        state.bal -= 5;
        persist();
        document.getElementById('bal').textContent = state.bal;
      }

      isSpinning = true;
      document.getElementById('roll-btn').disabled = true;

      const win = (Math.random() * 100) < state.chance;
      const winDeg = (state.chance / 100) * 360;
      const targetStop = win
        ? 8 + Math.random() * Math.max(8, winDeg - 16)
        : winDeg + 8 + Math.random() * Math.max(8, 360 - winDeg - 16);

      const mod = ((currentAngle % 360) + 360) % 360;
      const deltaToStop = ((targetStop - mod) + 360) % 360;
      const fullTurns = 6 * 360;
      const duration = 7000; // 7 секунд (в диапазоне 6-8 сек)

      animateArrowTo(currentAngle + fullTurns + deltaToStop, duration, () => {
        if (win) {
          const tgt = BABICH_CATALOG.find(x => x.id === state.targetId) || BABICH_CATALOG[1];
          const created = {
            uid: Date.now() + Math.floor(Math.random() * 10000),
            id: tgt.id,
            name: tgt.name,
            val: tgt.val,
            img: tgt.img
          };
          state.inv.push(created);
          state.selectedInvUid = created.uid;
          playWinFanfare();
          launchSparkles();
          notify('Успех: получен ' + tgt.name);
        } else {
          if (selInv) {
            state.inv = state.inv.filter(x => x.uid !== selInv.uid);
            state.selectedInvUid = state.inv[0] ? state.inv[0].uid : null;
          }
          notify('Неудача: предмет потерян');
        }
        isSpinning = false;
        document.getElementById('roll-btn').disabled = false;
        renderAll();
      });
    }

    renderAll();
  </script>
</body>
